<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Niño - Milo J</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         FONDO
    ========================== -->

    <div class="fondo">

        <!-- Luna -->
        <div class="luna"></div>

        <!-- Nubes -->
        <div class="nubes">
            <div class="nube nube1"></div>
            <div class="nube nube2"></div>
            <div class="nube nube3"></div>
        </div>

        <!-- Estrellas -->
        <div class="estrellas"></div>

        <!-- Niebla -->
        <div class="niebla niebla1"></div>
        <div class="niebla niebla2"></div>

        <!-- Campo / siluetas -->
        <div class="campo">
            <div class="pasto"></div>
            <div class="arbol arbol1"></div>
            <div class="arbol arbol2"></div>
            <div class="arbol arbol3"></div>
        </div>

        <!-- Hojas -->
        <div class="hojas">
            <span>🍂</span>
            <span>🍂</span>
            <span>🍂</span>
            <span>🍂</span>
            <span>🍂</span>
        </div>

        <!-- Partículas -->
        <div class="particulas"></div>

        <!-- Luz -->
        <div class="luz"></div>

    </div>


    <!-- =========================
         LETRA
    ========================== -->

    <main class="contenido">

        <div id="letra">
            Presiona ▶ para comenzar
        </div>

    </main>


    <!-- =========================
         BOTÓN
    ========================== -->

    <button id="botonMusica">▶</button>


    <!-- =========================
         MÚSICA
    ========================== -->

    <audio id="musica">

        <source src="musica.mp3" type="audio/mpeg">

        Tu navegador no puede reproducir este audio.

    </audio>


    <script src="script.js"></script>

</body>

</html>
